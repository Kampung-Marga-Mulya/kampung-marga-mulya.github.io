<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; script-src 'none'; object-src 'none'; base-uri 'self'">
  <meta name="robots" content="noindex">

    :root { --blue: #1452C2; --ink: #0A0A0A; --ink-2: #4A5160; --tint: #F4F7FC; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--tint); color: var(--ink); font: 1.0625rem/1.6 "Source Sans 3", "Segoe UI", Roboto, Arial, sans-serif; }
    main { width: min(560px, 100%); background: #fff; border-radius: 20px; padding: 32px 28px; text-align: center; }
    img { width: 56px; height: 56px; }
    h1 { font: 600 1.9rem/1.2 "Source Serif 4", Georgia, serif; margin: 14px 0 8px; }
    p { color: var(--ink-2); margin: 0 0 22px; }
    a.btn { display: inline-block; background: var(--blue); color: #fff; text-decoration: none; font-weight: 700; padding: 11px 20px; border-radius: 10px; }
    a.btn:hover { background: #0E3E94; }
  </style>
</head>
<body>
  <main>
    <img src="/assets/img/ikon.svg" alt="">
    <h1>Halaman tidak ditemukan</h1>
    <p>Alamat yang Anda buka tidak ada atau sudah dipindahkan. Silakan kembali ke beranda website Kampung Marga Mulya.</p>
