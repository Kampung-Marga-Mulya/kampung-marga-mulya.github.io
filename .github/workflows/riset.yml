name: Riset sumber cuaca
on:
  push:
    branches: [riset-cuaca]
permissions:
  contents: write
jobs:
  riset:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm i --silent --no-save playwright@1.47.2 && npx playwright install --with-deps chromium > /dev/null
      - run: pip install --quiet requests && mkdir -p hasil && python scripts/update_cuaca.py hasil/cuaca.json || true

      - name: Simpan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hasil
          git commit -m "Hasil riset cuaca" || exit 0
          git push
