name: Pemindaian keamanan kode (CodeQL)

# Memeriksa kode JavaScript, Python, dan alur kerja GitHub Actions dari celah keamanan umum
# (misalnya XSS dan injeksi) setiap ada perubahan kode dan setiap minggu.
on:
  push:
    branches: [main]
    paths: ["**/*.js", "**/*.html", "**/*.py", ".github/workflows/**"]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analisis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript", "python", "actions"]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config: |
            paths-ignore:
              - assets/vendor
              - scripts/arsip
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
