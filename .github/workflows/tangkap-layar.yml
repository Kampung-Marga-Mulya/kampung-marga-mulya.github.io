name: Tangkap layar website (sementara)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  tangkap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Pasang Playwright
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.48.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Ambil tangkapan layar situs live
        env:
          BASE: https://kampung-marga-mulya.github.io/
          OUT: ${{ github.workspace }}/ss
          CHANNEL: chrome
          NODE_PATH: /tmp/pw/node_modules
        run: node .github/ss/tangkap.js
      - name: Simpan ke cabang sementara
        run: |
          cd ss
          git init -q -b tangkapan-layar-tmp
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Tangkapan layar sementara"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" tangkapan-layar-tmp
