name: Cek domain (sementara)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  cek:
    runs-on: ubuntu-latest
    steps:
      - run: |
          sudo apt-get install -y -qq whois dnsutils >/dev/null 2>&1 || true
          for h in kampungmargamulya.com www.kampungmargamulya.com; do echo "== $h"; dig +short A $h; dig +short AAAA $h; dig +short CNAME $h; done
          echo "== NS"; dig +short NS kampungmargamulya.com
          echo "== WHOIS"; whois kampungmargamulya.com | grep -iE "domain name|registrar:|creation date|expir|name server|status|no match" | head -20
