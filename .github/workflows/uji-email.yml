name: Uji email notifikasi (sementara)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  uji:
    runs-on: ubuntu-latest
    steps:
      - name: Uji ntfy.sh (push + teruskan ke email)
        run: |
          curl -sS -i -X OPTIONS "https://ntfy.sh/margamulya-layanan-c1f9f9884a" -H "Origin: https://kampung-marga-mulya.github.io" -H "Access-Control-Request-Method: POST" | grep -i "^HTTP\|access-control" 
          echo ----
          curl -sS -i "https://ntfy.sh/margamulya-layanan-c1f9f9884a?title=Uji%20notifikasi%20layanan%20surat&email=seldiozora3@gmail.com&tags=envelope"             -H "Origin: https://kampung-marga-mulya.github.io" -H "Content-Type: text/plain"             --data "Uji pemberitahuan dari website Marga Mulya On Site. Tanpa data pribadi." | grep -iv "^date\|^alt-svc\|^strict"
