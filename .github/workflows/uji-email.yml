name: Uji email notifikasi (sementara)
on: workflow_dispatch
permissions:
  contents: read
jobs:
  uji:
    runs-on: ubuntu-latest
    steps:
      - name: Uji push ntfy (tanpa email)
        run: |
          curl -sS -i "https://ntfy.sh/margamulya-layanan-c1f9f9884a?title=Uji%20notifikasi%20layanan%20surat&tags=envelope&click=https%3A%2F%2Fwa.me%2F6285624924834"             -H "Origin: https://kampung-marga-mulya.github.io" -H "Content-Type: text/plain"             --data "Uji pemberitahuan dari website Marga Mulya On Site. Tanpa data pribadi." | grep -iv "^date\|^alt-svc\|^strict\|^ratelimit"
      - name: Cek Apps Script dapat dijangkau
        run: curl -sS -o /dev/null -w "script.google.com %{http_code}\n" https://script.google.com/
