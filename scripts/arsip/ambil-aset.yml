name: Ambil aset gambar (manual)
# Mengunduh berkas gambar dari alamat web ke cabang "aset" untuk diperiksa sebelum dipakai.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "Alamat berkas gambar"
        required: true
      nama:
        description: "Nama berkas tujuan, mis. logo-ipb.png"
        required: true
permissions:
  contents: write
jobs:
  ambil:
    runs-on: ubuntu-latest
    steps:
      - name: Unduh dan simpan ke cabang aset
        env:
          URL: ${{ github.event.inputs.url }}
          NAMA: ${{ github.event.inputs.nama }}
        run: |
          mkdir -p out && cd out
          curl -fsSL -A "Mozilla/5.0" "$URL" -o "$NAMA"
          file "$NAMA"
          git init -q -b aset
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$NAMA" && git commit -qm "Aset: $NAMA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" aset
